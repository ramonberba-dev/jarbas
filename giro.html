<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@600;800&family=DM+Serif+Display&family=Outfit:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Playfair+Display:wght@600;800&family=Sora:wght@400;600;800&family=Unbounded:wght@500;800&display=swap">
<style>
/* Layout: cabeçalho com marca + seletor de regional; abas de trabalho; tabelas densas tipo planilha comercial.
   As 10 identidades trocam tokens (cores, fontes, raio) e a posição da navegação. */
:root{
  --bg:#f6f4f8; --surface:#ffffff; --ink:#221a2b; --muted:#6c6177; --line:#e4dfe9;
  --accent:#b0306a; --accent-ink:#ffffff; --accent-soft:#f6e3ec;
  --good:#1f7a4d; --warn:#b26b00; --bad:#c0352b; --info:#2f5fa8;
  --good-soft:#e2f2e9; --warn-soft:#fbefd9; --bad-soft:#fbe4e1; --info-soft:#e3ecf8;
  --display:'Fraunces',Georgia,serif; --body:'Manrope',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131b; --surface:#211b27; --ink:#efe9f3; --muted:#a79bb2; --line:#352c3d;
  --accent:#e36aa0; --accent-ink:#1a0f15; --accent-soft:#3a2230;
  --good:#5cc690; --warn:#e9a845; --bad:#f07a6f; --info:#7ea6e8;
  --good-soft:#19352a; --warn-soft:#3b2d14; --bad-soft:#3d1f1c; --info-soft:#1c2a40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131b; --surface:#211b27; --ink:#efe9f3; --muted:#a79bb2; --line:#352c3d;
  --accent:#e36aa0; --accent-ink:#1a0f15; --accent-soft:#3a2230;
  --good:#5cc690; --warn:#e9a845; --bad:#f07a6f; --info:#7ea6e8;
  --good-soft:#19352a; --warn-soft:#3b2d14; --bad-soft:#3d1f1c; --info-soft:#1c2a40; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1380px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-family:var(--display);font-size:21px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.regs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:calc(var(--radius) + 4px);margin-left:auto;flex-wrap:wrap}
.regs button{border:0;background:transparent;padding:7px 12px;border-radius:var(--radius);cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.regs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.stamp{color:var(--muted);font-size:12px}

main{padding-block:20px 60px;display:grid;gap:22px}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.lead{max-width:75ch;color:var(--ink);font-size:15px;margin:6px 0 0}
.lead b{color:var(--accent)}
section[hidden]{display:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.sort{cursor:pointer}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.prod b{display:block;font-weight:700}
.prod small{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.route{white-space:nowrap;font-weight:700}
.route i{font-style:normal;color:var(--accent);margin:0 4px}
.grade{font-family:var(--mono);font-size:12px;white-space:nowrap}
.grade span{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-radius:4px;margin:0 2px 2px 0}
.grade span.c{border-color:var(--accent);background:var(--accent-soft)}
.why{color:var(--muted);font-size:12.5px;max-width:42ch}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.ok{background:var(--good-soft);color:var(--good)} .wa{background:var(--warn-soft);color:var(--warn)}
.ba{background:var(--bad-soft);color:var(--bad)} .in{background:var(--info-soft);color:var(--info)}
.ac{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;min-width:0}
.filters input{flex:1 1 200px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:8px}
.rtit{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rcol{display:grid;gap:3px}.rcol .chip{justify-self:start;margin-bottom:2px}
.rl{font-size:13px}.rl b{font-variant-numeric:tabular-nums}
.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:7px 28px 7px 10px;white-space:nowrap}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:"▾";position:absolute;right:10px;color:var(--muted)}
.msp{position:absolute;z-index:6;top:calc(100% + 4px);left:0;width:min(420px,calc(100vw - 32px));max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 14%,transparent)}
.msi{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;font-size:13px}
.msi input[type=checkbox]{flex:none;width:18px;height:18px;min-height:0;margin:0;accent-color:var(--accent)}
.msi span:nth-child(2){min-width:0}
.msh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:-10px;background:var(--surface);padding:4px 0;z-index:1}
.msb{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-weight:700}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.done td{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.bars{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 70px;gap:10px;align-items:center;font-size:12.5px}
.brow .t{height:14px;background:var(--bg);border-radius:3px;overflow:hidden;display:flex}
.brow .t i{display:block;height:100%}
.brow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);max-width:90ch}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);font-weight:700;z-index:20}

/* identidades */
.ids{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.id{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface);text-align:left;padding:0}
.id[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.id .sw{padding:18px;display:flex;gap:12px;align-items:center;min-height:96px}
.id .sw svg{width:52px;height:52px;flex:none}
.id .sw b{font-size:20px;line-height:1.05;display:block}
.id .sw small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.id .meta{padding:12px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.id .meta b{color:var(--ink);display:block;font-size:13px;margin-bottom:2px}
.id .pal{display:flex;height:8px}
.id .pal i{flex:1}

/* variação de navegação lateral */
@media (min-width:1000px){
  body.side .shell{display:grid;grid-template-columns:230px 1fr;gap:0}
  body.side header.top{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line)}
  body.side header.top .wrap{padding:0 16px}
  body.side .bar{flex-direction:column;align-items:stretch}
  body.side .regs{margin-left:0;flex-direction:column}
  body.side nav.tabs{flex-direction:column}
  body.side nav.tabs button{text-align:left;border-bottom:0;border-left:3px solid transparent;border-radius:0}
  body.side nav.tabs button[aria-selected="true"]{border-left-color:var(--accent)}
  body.side .content .wrap{max-width:none}
}
body.dense td{padding:6px 8px} body.dense .kpi b{font-size:24px}
@media (prefers-reduced-motion:no-preference){.regs button,nav.tabs button,.id{transition:background .15s,color .15s,outline-color .15s}}
@media (max-width:640px){.brand b{font-size:18px}.regs{margin-left:0;width:100%}.regs button{flex:1}}
nav.tabs .ic,nav.tabs .cel,.mfil{display:none}
@media (max-width:720px){nav.tabs .cel{display:inline}}
/* celular: letras maiores, toques de 44px, abas fixas embaixo e tabelas viram cartões (rótulos vindos do cabeçalho via data-label) */
@media (max-width:720px){
  body{font-size:16px;line-height:1.5}
  .bar{padding-block:10px;gap:10px}
  .brand svg{width:34px;height:34px}
  .brand small{font-size:12px}
  .regs{padding:3px}
  .regs button{font-size:15px;min-height:44px;padding:8px 6px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));gap:0;justify-content:space-between;box-shadow:0 -4px 16px color-mix(in srgb,var(--ink) 8%,transparent)}
  nav.tabs button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;font-size:12px;font-weight:700;border-bottom:0;border-radius:12px;min-height:56px}
  nav.tabs button .ic{display:block;width:24px;height:24px}
  nav.tabs button .tx{white-space:nowrap}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  nav.tabs button .lg{display:none}
  main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));gap:18px}
  h2{font-size:25px}
  h3{font-size:13.5px}
  .lead{font-size:16px;line-height:1.55}
  .note,.why{font-size:14px;max-width:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}
  .kpi span{font-size:13px}
  .kpi b{font-size:26px}
  .kpi small{font-size:13px}
  .card{padding:14px;border-radius:14px}
  .chip{font-size:13px;padding:3px 10px}
  button,select,input,.btn,.ms summary{min-height:44px;font-size:16px}
  .btn{padding:10px 14px;border-radius:12px}
  header.top{position:static}
  .filters{gap:10px}
  .filters .mfil{display:block;flex:1 1 100%}
  .filters:not(.aberto)>select,.filters:not(.aberto)>.ms{display:none}
  table.tcard td.sel{border-bottom:0;padding-bottom:0;justify-content:flex-start;align-items:center;gap:10px}
  table.tcard td.sel::before{max-width:none}
  .filters>select,.filters>input,.filters>.ms{flex:1 1 100%;width:100%}
  .filters>.btn{flex:1 1 calc(50% - 5px)}
  .filters>.btn.p{flex-basis:100%}
  .filters select,.filters input,.ms summary{padding:10px 12px;border-radius:12px;background:var(--surface)}
  .msp{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;max-height:60vh;z-index:9}
  .msp{box-shadow:0 0 0 100vmax color-mix(in srgb,#000 40%,transparent);padding:0 12px 12px;top:calc(12px + env(safe-area-inset-top,0px));max-height:none}
  .msh{top:0;padding:12px 0 8px;margin:0;border-bottom:1px solid var(--line)}
  .msh b{font-size:17px}
  .msh .btn{min-height:42px;padding:8px 18px}
  .msb{margin:10px 0 4px}
  .msb .btn{flex:1 1 auto;min-height:42px;padding:8px 10px;font-size:15px}
  .msi{grid-template-columns:26px 1fr;font-size:16px;padding:10px 2px;border-bottom:1px solid var(--line);row-gap:4px}
  .msi input[type=checkbox]{width:24px;height:24px;grid-row:span 2}
  .msi .chip{grid-column:2;justify-self:start}
  .brow{grid-template-columns:minmax(0,1fr) 38% 56px;font-size:14px;gap:8px}
  .brow .t{height:16px}
  .legend{font-size:13px}
  .rl{font-size:15px}
  /* tabelas em cartões */
  table.tcard,table.tcard tbody{display:block;width:100%}
  table.tcard thead{display:none}
  table.tcard tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px 8px;margin-bottom:10px}
  table.tcard tr.done{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  table.tcard tr:hover td,table.tcard tr.done td{background:none}
  table.tcard td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
  table.tcard td:last-child{border-bottom:0}
  table.tcard td::before{content:attr(data-label);color:var(--muted);font-size:13px;font-weight:600;text-align:left;flex:none;max-width:45%}
  table.tcard td[data-label=""]::before{display:none}
  table.tcard td.wide{display:block;text-align:left}
  table.tcard td.wide::before{display:block;margin-bottom:4px;max-width:none}
  table.tcard td.n{justify-content:space-between}
  table.tcard td input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--accent)}
  table.tcard .prod b{font-size:16px}
  table.tcard .prod small{font-size:13px}
  table.tcard .route{white-space:normal}
  table.tcard .grade{white-space:normal;font-size:14px}
  table.tcard .grade span{padding:3px 7px;margin:0 4px 4px 0}
  table.tcard td input[type=email]{width:100%;min-width:0!important}
  table:not(.tcard){font-size:14px}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}

.brand b{font-size:30px;letter-spacing:.08em;color:#f4cf7a}

nav.tabs button[aria-selected="true"]{color:#f4cf7a}

<div class="shell">
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand" id="brand"></div>
    <div class="regs" role="group" aria-label="Regional" id="regs"></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>

<div class="content"><main class="wrap" id="main">
  <section id="v-geral"></section>
  <section id="v-analise" hidden></section>
  <section id="v-reman" hidden></section>
  <section id="v-ruptura" hidden></section>
  <section id="v-parado" hidden></section>
  <section id="v-lojas" hidden></section>
  <section id="v-ident" hidden></section>
</main></div>

<script type="text/plain" id="appjs">
// PDF de remanejamento por loja, no visual Passo Certo (jsPDF). Usado pelo app (e-mail e "Baixar PDF").
// dados = { loja, data, envia:[{grupo, pares, itens:[{ref, desc, cores:[{n,t}], qtd, foto, par}]}], recebe:[...] }
// foto = jpeg em base64 (miniatura 240px) ou vazio. Retorna o PDF em base64.
function pdfLoja(jsPDF, dados) {
  const d = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
  const W = 210, M = 14, BASE = 282;
  const verde = [29, 107, 79], tinta = [22, 36, 29], mudo = [93, 110, 100], linha = [219, 229, 223], suave = [220, 239, 230], fundo = [243, 246, 244];
  let y = 0;
  const logo = (x, yy, s) => {
    d.setFillColor(255, 255, 255); d.roundedRect(x, yy, s, s, s * 0.29, s * 0.29, 'F');
    d.setFillColor(...verde); d.ellipse(x + s * 0.375, yy + s * 0.58, s * 0.105, s * 0.19, 'F');
    d.ellipse(x + s * 0.645, yy + s * 0.4, s * 0.105, s * 0.19, 'F'); d.circle(x + s * 0.375, yy + s * 0.31, s * 0.045, 'F');
  };
  const cabecalho = () => {
    d.setFillColor(...verde); d.rect(0, 0, W, 28, 'F'); logo(M, 7, 14);
    d.setTextColor(255, 255, 255); d.setFont('times', 'normal'); d.setFontSize(19); d.text('Passo Certo', M + 19, 14);
    d.setFont('helvetica', 'normal'); d.setFontSize(7.5); d.text('REMANEJAMENTO DE ESTOQUE  ·  SONHO DOS PÉS', M + 19, 20);
    d.setFont('helvetica', 'bold'); d.setFontSize(12); d.text(dados.loja, W - M, 13, { align: 'right' });
    d.setFont('helvetica', 'normal'); d.setFontSize(9); d.text(dados.data, W - M, 19, { align: 'right' });
    y = 36;
  };
  const cabe = h => { if (y + h > BASE) { d.addPage(); cabecalho(); } };
  const total = arr => arr.reduce((a, g) => a + g.pares, 0);
  cabecalho();
  // resumo
  d.setFillColor(...fundo); d.roundedRect(M, y, W - 2 * M, 18, 3, 3, 'F');
  const kp = [['Envia', total(dados.envia) + ' ' + (dados.envia.concat(dados.recebe).some(g => g.itens.some(i => i.par === false)) ? 'peças' : 'pares')], ['Recebe', total(dados.recebe) + ' ' + (dados.envia.concat(dados.recebe).some(g => g.itens.some(i => i.par === false)) ? 'peças' : 'pares')], ['Lojas envolvidas', String(new Set([...dados.envia, ...dados.recebe].map(g => g.grupo)).size)]];
  kp.forEach(([r, v], i) => { const x = M + 6 + i * 60; d.setTextColor(...mudo); d.setFont('helvetica', 'normal'); d.setFontSize(8); d.text(r.toUpperCase(), x, y + 7); d.setTextColor(...tinta); d.setFont('helvetica', 'bold'); d.setFontSize(13); d.text(v, x, y + 14); });
  y += 26;
  const secao = (titulo, grupos, rot) => {
    cabe(16); d.setTextColor(...tinta); d.setFont('times', 'normal'); d.setFontSize(15); d.text(titulo, M, y); y += 7;
    if (!grupos.length) { d.setFont('helvetica', 'normal'); d.setFontSize(10); d.setTextColor(...mudo); d.text('Nada neste remanejamento.', M, y); y += 10; return; }
    for (const g of grupos) {
      cabe(34); d.setFillColor(...suave); d.roundedRect(M, y - 4.5, W - 2 * M, 8, 2, 2, 'F');
      d.setTextColor(...verde); d.setFont('helvetica', 'bold'); d.setFontSize(10); d.text(`${rot} ${g.grupo}`, M + 3, y + 1);
      d.text(`${g.pares} ${g.itens.some(i => i.par === false) ? 'peças' : 'pares'}`, W - M - 3, y + 1, { align: 'right' }); y += 8;
      for (const it of g.itens) {
        const desc = d.splitTextToSize(it.desc, 112), cores = it.cores.map(c => `${c.n}:  ${c.t.replace(/:/g, '×').replace(/ /g, '   ')}`);
        const h = Math.max(24, 9 + desc.length * 4.2 + cores.length * 4.6);
        cabe(h);
        if (it.foto) { try { d.addImage('data:image/jpeg;base64,' + it.foto, 'JPEG', M, y, 20, 20, 'f' + it.ref); /* alias: a mesma foto entra uma vez só no arquivo */ } catch (e) { } }
        else { d.setDrawColor(...linha); d.setLineDashPattern([1, 1], 0); d.roundedRect(M, y, 20, 20, 2, 2); d.setLineDashPattern([], 0); }
        const x = M + 25; let yy = y + 4;
        d.setTextColor(...mudo); d.setFont('helvetica', 'normal'); d.setFontSize(8); d.text('REF. ' + it.ref, x, yy); yy += 4.5;
        d.setTextColor(...tinta); d.setFont('helvetica', 'bold'); d.setFontSize(10); d.text(desc, x, yy); yy += desc.length * 4.2 + 0.8;
        d.setFont('helvetica', 'normal'); d.setFontSize(9.5); for (const c of cores) { d.text(c, x, yy); yy += 4.6; }
        d.setTextColor(...verde); d.setFont('helvetica', 'bold'); d.setFontSize(16); d.text(String(it.qtd), W - M - 3, y + 11, { align: 'right' });
        d.setTextColor(...mudo); d.setFont('helvetica', 'normal'); d.setFontSize(7.5); d.text(it.par === false ? 'peças' : 'pares', W - M - 3, y + 15, { align: 'right' });
        y += h; d.setDrawColor(...linha); d.setLineWidth(0.2); d.line(M, y - 2, W - M, y - 2);
      }
      y += 4;
    }
    y += 3;
  };
  secao('O que a loja envia', dados.envia, 'Para');
  secao('O que a loja vai receber', dados.recebe, 'De');
  cabe(14); d.setTextColor(...mudo); d.setFont('helvetica', 'normal'); d.setFontSize(9);
  d.text('Confiram a numeração na separação e avisem se algum par não estiver na loja.', M, y + 2);
  const n = d.getNumberOfPages();
  for (let i = 1; i <= n; i++) { d.setPage(i); d.setFontSize(7.5); d.setTextColor(...mudo); d.text(`Gerado pela Central Passo Certo  ·  página ${i} de ${n}`, W / 2, 291, { align: 'center' }); }
  return d.output('datauristring').split(',')[1];
}
if (typeof module !== 'undefined') module.exports = { pdfLoja };

function aplicaId(k){
  ID = IDS.find(i=>i.k===k)||IDS[0];
  const dark = document.documentElement.dataset.theme==='dark' || (document.documentElement.dataset.theme!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const p = dark?ID.d:ID.l, s=document.documentElement.style;
  for(const [t,v] of Object.entries(p)) s.setProperty('--'+t,v);
  s.setProperty('--accent-ink', dark?'#111':'#fff');
  s.setProperty('--display',ID.fonte); s.setProperty('--body',ID.corpo); s.setProperty('--radius',Math.min(ID.r,14)+'px');
  document.body.classList.toggle('side',ID.nav==='side'); document.body.classList.toggle('dense',!!ID.dense);
  document.getElementById('brand').innerHTML = ID.logo(p.accent)+`<div><b>${ID.nome}</b><small>${ID.tag}</small></div>`;
  ls('cg-id2',ID.k); // padrão escolhido pelo Ramon: Passo Certo
  if(!document.getElementById('v-ident').hidden) vIdent();
}

/* ---------- Visão geral ---------- */
function vGeral(){
  const L=lojasR(), S=sugR();
  const sum=(a,k)=>a.reduce((x,y)=>x+(y[k]||0),0);
  const estPar=sum(L,'estPar'), v7=sum(L,'v7Par'), par=sum(L,'parParados'), furo=sum(L,'furadas'), calc=sum(L,'calc');

  const inter=S.filter(s=>!s.intra).length;
  const nome = REGS[REG];
  $('#v-geral').innerHTML=`
  <div><h2>${nome}</h2>
  <p class="lead">Cobertura de <b>${f1(wos)} semanas</b> em calçados (${f0(estPar)} pares para ${f0(v7)} vendidos em 7 dias).
  ${f0(par)} pares (${f1(100*par/estPar)}%) estão nos 30 produtos mais parados de cada loja, sem venda há 30 dias ou mais.
  ${f1(100*furo/calc)}% dos produtos de calçado com 4+ pares estão com grade furada no 35, 36 ou 37.

// dados do PDF da loja: o que envia (por destino) e o que recebe (por origem), com foto
function dadosPdf(cod,S){
  // o envio pelo conector aceita ~1 MB: fotos entram até ~650 mil caracteres (cada foto conta uma vez)
  let orc=650000; const usadas=new Set();
  const ft=ref=>{const f=FOTOS[ref];if(!f)return '';if(usadas.has(ref))return f;if(f.length>orc)return '';orc-=f.length;usadas.add(ref);return f};
  const grupo=(arr,campo)=>{const g={};for(const s of arr)(g[s[campo]]??=[]).push(s);return Object.entries(g).map(([c,a])=>({grupo:nCurto(c),pares:a.reduce((x,s)=>x+s.qtd,0),itens:a.map(s=>({ref:s.ref,desc:s.desc,cores:s.cores,qtd:s.qtd,foto:ft(s.ref),par:s.par}))}))};
  return {loja:nCurto(cod),data:new Date().toLocaleDateString('pt-BR'),envia:grupo(S.filter(s=>s.de===cod),'para'),recebe:grupo(S.filter(s=>s.para===cod),'de')};
}
const nomePdf=cod=>`Remanejamento ${LJ[cod].num} ${LJ[cod].nome} ${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.pdf`;

let DL=null; if(window.claude?.use) claude.use('downloads').then(d=>{DL=d}).catch(()=>{});
async function baixarPdf(cod,S){
  try{ const b=pdfBase64(cod,S), bin=atob(b), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const blob=new Blob([u],{type:'application/pdf'});
    if(!DL){ if(window.claude){toast('Baixar arquivo não está disponível nesta visualização');return}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nomePdf(cod);document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return }
    await DL.save({filename:nomePdf(cod),data:blob}); }
  catch(e){ if(e?.code!=='declined'&&e?.code!=='cancelled') toast('Não foi possível gerar o PDF'); }
}
async function enviar(c,S){
  const t=textoEmail(c,S), to=EMAILS[c], hm=htmlEmail(c,S);

  let pdf=null; try{ pdf=pdfBase64(c,S); }catch(e){}
  if(window.PLAT?.enviar){ // app de celular: o servidor (conta da empresa) envia
    const r=await PLAT.enviar({to,cc:CC,assunto:t.assunto,corpo:t.corpo,html:hm.html,pdf,nomePdf:nomePdf(c)});
    if(r.ok) ENVIADO[c]=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return r.ok?{ok:true}:{ok:false,msg:r.msg||'Não enviou.'};
  }
  try{ await MCP.callTool('Gmail','send_message',{to:[to],cc:CC,subject:t.assunto,body:t.corpo,htmlBody:hm.html,...(pdf?{attachments:[{content:pdf,filename:nomePdf(c),mimeType:'application/pdf'}]}:{})},{cache:false}); ENVIADO[c]=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    DB?.collection('envios').add?.({loja:c,para:to,assunto:t.assunto,itens:S.filter(s=>s.de===c||s.para===c).map(key),em:Date.now()}).catch(()=>{});

}

/* ---------- Parados e liquidação ---------- */
function markdown(p){
  const wos = p.venda30? p.saldo/(p.venda30/4.3) : Infinity;
  const velho = p.col && /20(1\d|2[0-4])/.test(p.col);
  if(wos>52||(!p.venda30)) return {pct:velho?50:40, t:'Liquidar', c:'ba', w:wos};
  if(wos>26) return {pct:velho?40:30, t:'Remarcar', c:'wa', w:wos};
  if(wos>12) return {pct:20, t:'Vitrine + isca', c:'in', w:wos};
  return {pct:0, t:'Remanejar', c:'ok', w:wos};
}
function vParado(){
  const L=lojasR();
  $('#v-parado').innerHTML=`
  <div><h2>Parados e liquidação</h2><p class="lead">Produtos parados em muitas lojas e vendendo pouco na rede. Cobertura = saldo ÷ venda semanal (venda de 30 dias das lojas que mais vendem). Acima de 52 semanas a venda casada e o remanejamento não resolvem: é preço.</p></div>
  <div class="card"><h3>Mais parados da rede</h3><div class="scroll"><table><thead><tr><th>Produto</th><th>Coleção</th><th class="n">Saldo</th><th class="n">Lojas paradas</th><th class="n">Venda 30d (top lojas)</th><th class="n">Cobertura</th><th>Ação</th><th>Onde vende</th></tr></thead><tbody>
  ${DATA.liquidar.map(p=>{const m=markdown(p);return `<tr><td class="prod">${comFoto(p.ref,`<b>${esc(p.desc)}</b><small>${p.ref} · ${esc(p.sub||'')}</small>`)}</td><td>${esc(p.col||'—')}</td><td class="n">${f0(p.saldo)}</td><td class="n">${p.nParadas}</td><td class="n">${p.venda30}</td><td class="n">${m.w===Infinity?'∞':f0(m.w)+' sem.'}</td><td><span class="chip ${m.c}">${m.t}${m.pct?' −'+m.pct+'%':''}</span></td><td class="why">${p.vendem.map(v=>{const l=DATA.lojas.find(x=>x.num===v.loja);return esc(l?l.num+' '+l.nome:v.loja)+': '+v.q}).join(' · ')}</td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="card"><h3>Peso do parado por loja</h3><div class="scroll"><table><thead><tr><th>Loja</th><th>Regional</th><th class="n">Produtos parados</th><th class="n">Pares parados (top 30)</th><th class="n">% do estoque de calçado</th><th class="n">Chegou em 30 dias</th></tr></thead><tbody>
  ${[...L].sort((a,b)=>b.pctParado-a.pctParado).map(l=>`<tr><td>${l.num} ${esc(l.nome)}</td><td>${regTag(l.cod)}</td><td class="n">${f0(l.nParado)}</td><td class="n">${f0(l.parParados)}</td><td class="n"><span class="chip ${l.pctParado>15?'ba':l.pctParado>8?'wa':'ok'}">${f1(l.pctParado)}%</span></td><td class="n">${f0(l.entrou30)}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">Venda casada sugerida: em loja que recebe calçado por remanejamento, levar junto bolsa e carteira da mesma cor (ex.: "leve a bolsa com 20% na compra do sapato") para subir o PA.</p></div>`;
}

  const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light' || document.documentElement.dataset.theme==='dark';
  $('#v-ident').innerHTML=`<div><h2>10 opções de layout e logomarca</h2><p class="lead">Toque numa opção para aplicar no app inteiro. Cada uma muda logo, nome, cores, tipografia e o jeito da navegação (topo ou lateral no computador). A escolha fica salva neste aparelho.</p></div>
  <div class="ids">${IDS.map((i,n)=>{const p=dark?i.d:i.l;return `<button class="id" aria-pressed="${i.k===ID.k}" data-k="${i.k}">
   <div class="sw" style="background:${p.bg};color:${p.ink};font-family:${i.fonte}">${i.logo(p.accent)}<div><b>${i.nome}</b><small style="font-family:${i.corpo}">${i.tag}</small></div></div>
   <div class="pal">${[p.accent,p['accent-soft'],p.ink,p.muted,p.bg].map(c=>`<i style="background:${c}"></i>`).join('')}</div>
   <div class="meta"><b>${n+1}. ${i.nome}</b>Navegação ${i.nav==='side'?'lateral':'no topo'} · cantos ${i.r>=20?'bem arredondados':i.r<=4?'retos':'suaves'}${i.dense?' · tabela compacta':''}</div></button>`}).join('')}</div>`;

/* ---------- navegação ---------- */
const TABS=[['geral','Visão geral',vGeral],['analise','Análise de remanejamentos',vAnalise],['reman','Remanejamentos',vReman],['ruptura','Rupturas e grade',vRuptura],['parado','Parados e liquidação',vParado],['lojas','Lojas',vLojas]];
// nome curto e ícone de cada aba na barra de baixo do celular
const TAB_CEL={geral:['Geral','M3 12l9-8 9 8M5 10v10h14V10'],analise:['Análise','M4 20V10M10 20V4M16 20v-7M22 20H2'],reman:['Remanejar','M4 8h13l-4-4M20 16H7l4 4'],ruptura:['Rupturas','M12 3l9 16H3zM12 10v4M12 17v.5'],parado:['Parados','M6 4h4v16H6zM14 4h4v16h-4z'],lojas:['Lojas','M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6'],ident:['Layout','M12 3a9 9 0 100 18c1 0 1.5-.8 1.5-1.6 0-1.3 1-1.9 2-1.9H18a3 3 0 003-3c0-6-4-11.5-9-11.5zM7.5 12h.01M10 7.5h.01M15 7.5h.01']};
const icTab=k=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${TAB_CEL[k][1]}"/></svg>`;
// celular: toda tabela de dados vira cartão; cada célula ganha o rótulo da sua coluna
function rotular(raiz){
  for(const t of raiz.querySelectorAll('table')){
    const ths=[...t.querySelectorAll('thead th')]; if(ths.length<3||t.dataset.fix)continue;
    t.classList.add('tcard'); const nomes=ths.map(th=>th.textContent.trim());
    for(const tr of t.querySelectorAll('tbody tr')) [...tr.children].forEach((td,i)=>{ if(td.dataset.label!==undefined)return;
      td.dataset.label=nomes[i]||''; if(td.querySelector(':scope>input[type=checkbox]')){td.classList.add('sel');td.dataset.label='Selecionar';return}
      if(i===0||td.classList.contains('prod')||td.classList.contains('grade')||td.classList.contains('why')||td.querySelector('.route,.bars,input[type=email]')||(td.querySelector('div')&&!td.classList.contains('n')))td.classList.add('wide'); });
  }
}
new MutationObserver(()=>rotular($('#main'))).observe($('#main'),{childList:true,subtree:true});
function render(){
  $('#regs').innerHTML=Object.entries(REGS).map(([k,v])=>`<button aria-pressed="${k===REG}" data-r="${k}">${k==='U'?'Universal':v.replace('Regional ','')}</button>`).join('');
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button role="tab" aria-selected="${k===TAB}" data-t="${k}" aria-label="${t}">${icTab(k)}<span class="tx lg">${t}</span><span class="tx cel">${TAB_CEL[k][0]}</span></button>`).join('');
  for(const [k,,fn] of TABS){const s=$('#v-'+k);s.hidden=k!==TAB;if(k===TAB)fn()}
  document.querySelectorAll('#regs button').forEach(b=>b.onclick=()=>{REG=b.dataset.r;ls('cg-reg',REG);render()});
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;history.replaceState(null,'','#'+TAB);render();scrollTo(0,0)});
}
const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) TAB=h;
aplicaId('jarbas'); render();
</script>

})();
